# ================= Global Settings =================
task: train
scheme: SCHEME      # select model: convcoupler / afcoupler / acoupler / acdnet / rcdnet
exp_dir: ./exp/DeepMIMO/input_3antx3car/SCHEME

# ================= Dataset Config =================
dataset_type: DeepmimoO1
data_dirs:
  - ./data/DeepMIMO/O1/32antx32car_3p5GHz_40MHz_R501-1400_V1_23-9-25
const_h: 10000

#dataset_type: DICHASUS
#data_dirs:
#  - ./data/DICHASUS/h5_CD/ca01
#const_h: 1

dichasus:
  train_dataset_name: train_nearest32_seq36000.h5
  test_dataset_name: test_nearest32_seq36000.h5

# ================= System Config =================
# These parameters define the input shape and physical meaning, shared by all models
num_ant: 32                   # Total number of antennas
num_car: 32                   # Total number of carriers
input_ant_size: 3             # Number of sparse input antennas
input_car_size: 3             # Number of sparse input carriers
num_cur_range_train: [0, 1]   # Number of current samples added into past during training (previously [0, 4])
train_snrdb_range: ~          # Randomly add noise to past samples according to the SNR range

# ================= Training Pipeline Parameters =================
max_samples: ~
batch_size: 100   # acdnet/rcdnet: 500
micro_batch: 100  # acdnet/rcdnet: 500
num_workers: 4
num_epochs: 100000
print_freq: 10
log_step_inter: 100
save_epoch_inter: 10000
test_epoch_inter: 200
tensorboard_writer: True

# ================= Loss Configuration =================
loss_type: mse
mse_weighted_by_snr:
  clip_min: ~   # 0
  clip_max: ~   # 25
  use_softmax: False
  temperature: 1

# ================= All Model Schemes =================
conv_coupler:
  d_model: 128
  depth_pred: 8
  dropout: 0.

acoupler:
  d_model: 128
  num_heads: 1
  heads_aggregate: False
  depth_pred: 8
  dropout: 0.

afcoupler:
  d_model: 128
  depth_pred: 8
  is_learnable: True
  dropout: 0.

rcdnet:
  depth: 3         # Estimation network depth
  depth_pred: 2    # Prediction network depth
  hidden_size: 512
  dropout: 0.

acdnet:
  depth: 3
  depth_pred: 6
  hidden_size: 512
  dropout: 0.

convlstm:
  hidden_dim: 16
  depth_pred: 2

# ================= Optimizer and Scheduler Configuration =================
# Initial learning rate (if TransformerWarmup is used, this is usually a baseline or overridden by the scheduler)
learning_rate: !!float 1e-3

lr_scheduler:
  type: TransformerWarmupScheduler
  update_mode: step           # Update mode: step / epoch

lr_scheduler_list:
  # --- Scheme A: Transformer warmup (updated per step) ---
  TransformerWarmupScheduler:
    d_model: 512
    warmup_steps: 4000

  # --- Scheme B: StepLR decay (updated per epoch) ---
  StepLR:
    step_size: 10000          # Decay once every 10000 epochs
    gamma: 0.8

  # --- Scheme C: MultiStepLR decay (updated when epochs reach specified milestones) ---
  MultiStepLR:
    milestones: [30000, 40000, 50000]
    gamma: 0.2
