# 任务类型
task: train
scheme: acoupler # rcdnet, afcoupler, acoupler, acdnet
exp_dir: ./exp/acoupler_ddp_run

# 数据路径
data_root: /home/chenzirui/Desktop/home_mnt/32ant*32car_3.5GHz_40MHz_R501-1400_V1_23.9.25

# DDP & 硬件设置
gpu: '0,1' # 仅作参考，实际由 torchrun 控制
batch_size: 250 # 注意：这是单卡 batch size！如果总 batch=500, 2张卡则设为250
num_workers: 4

# TensorBoard
tensorboard_writer: True
log_step_inter: 10 # 每多少 step 记录一次 loss

# 训练参数
num_epochs: 100000
learning_rate: 0.001
lr_decay_steps: [30000, 40000, 50000, 60000]
lr_decay_factor: 0.2
save_epoch_inter: 200
test_epoch_inter: 200

# 模型参数
num_ant: 32
num_car: 32
input_ant_size: 3
input_car_size: 3
model:
  d_model: 128
  num_heads: 8
  depth_pred: 8
  depth: 3 # RCDNet/ACDNet 用

# 恢复训练
resume: False
checkpoint_path: ~